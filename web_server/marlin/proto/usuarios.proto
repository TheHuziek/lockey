syntax = "proto3";
package usuarios;

// Definición del servicio
service UsuarioService {
  rpc ObtenerUsuario (UsuarioRequest) returns (UsuarioResponse);
}

// Mensajes de solicitud y respuesta
message UsuarioRequest {
  int32 id = 1;
}

message UsuarioResponse {
  int32 id = 1;
  string nombre = 2;
  string email = 3;
}