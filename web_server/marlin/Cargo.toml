[package]
name = "marlin"
version = "0.1.0"
edition = "2024"

[dependencies]
hyper = { version = "1.0", features = ["full"] }
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aws-config = "1.1"
aws-sdk-lambda = "1.1"

tonic = "0.12"
prost = "0.13"


[build-dependencies]
tonic-build = "0.12"