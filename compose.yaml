version: '3.8'

services:
  #imagen para base de datos(mariadb)
  db:
    image: mariadb:latest
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: caballo_homosexual_de_las_montañas
      MARIADB_DATABASE: lockey
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
  #imagen para el frontend
  frontend:
    build: marcelo/.
    ports:
      - "3000:3000"
    volumes:
    - type: bind
      source: ./frontend
      target: /var/marcelo/html
      read_only: true
    depends_on:
      - auth
      - crud
  #imagen para el microservicio de autenticación
  auth:
    build: auth/.
    ports:
      - "5000:5000"
    depends_on:
      - mahi
  #imagen para el microservicio de CRUD
  crud:
    build: crud/.
    ports:
      - "6000:6000"
    depends_on:
      - mahi
  #imagen para el microservicio de Marcelo
  mahi:
    build: mahi/.
    ports:
      - "7000:7000"
    depends_on:
      - db
volumes:
  mariadb_data: