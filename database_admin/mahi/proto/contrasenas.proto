syntax = "proto3";
package usuarios;

// Definición del servicio
service PassService {
  rpc ReadPass (ReadRequest) returns (ReadResponse);
  rpc CreatePass (CreateRequest) returns (CreateResponse);
  rpc DelPass (DelRequest) returns (DelResponse);
  rpc UpdatePass (UpdateRequest) returns (UpdateResponse);
}

// Mensajes de solicitud y respuesta
message CreateRequest {
  string plataforma=1;
  String nombre_usuario=2;
  string pass=3;
  string hash_user=4;
}

message CreateResponse {
    string mensaje=1;
    int32 status_code=2;
}
message ReadRequest{
    string hash_usuario=1;
}
message ReadResponse{
    string lista_pass=1;
    optional int32 err_code=2;
    optional string mensaje_error=3;
}
message DelRequest{
    string plataforma=1;
    string hash_usuario=2;
}
message DelResponse{
    string mensaje=1;
    
}